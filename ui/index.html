<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lanes</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <main class="panel" id="panel">
    <!-- Title bar: the window's traffic lights sit at its left. Draggable. -->
    <header class="head" data-tauri-drag-region>
      <span class="wordmark" role="img" aria-label="Appbox" data-tauri-drag-region></span>
      <span class="sep" aria-hidden="true" data-tauri-drag-region></span>
      <span class="nm" data-tauri-drag-region>Lanes</span>
    </header>

    <!-- The current view (rendered by panel.js) -->
    <div class="body" id="body"></div>

    <!-- Footer (lane list only) -->
    <footer class="foot" id="foot">
      <button class="foot-btn" id="addBtn" type="button">
        <svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z" /></svg>
        Add lane
      </button>
      <button class="foot-btn" id="copyBtn" type="button">Copy setup…</button>
      <button class="btn btn-ghost done" id="doneBtn" type="button">Done</button>
    </footer>
  </main>

  <script src="panel.js"></script>
</body>
</html>
