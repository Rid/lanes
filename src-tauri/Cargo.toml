[package]
name = "lanes"
version = "0.1.1"
description = "A tiny macOS menu-bar launcher that opens AI desktop apps in isolated profiles."
authors = ["Synthetixis"]
edition = "2021"

[lib]
name = "lanes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No tray-icon feature: the menu-bar item is a native NSStatusItem with an NSMenu
# (src/menu.rs), so macOS handles its highlight and behaviour like any menu.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS only: the menu-bar item and its native menu. These are the AppKit
# bindings Tauri itself already builds on, at the same versions.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSGeometry",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSAlert",
  "NSApplication",
  "NSBezierPath",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }

# Lanes makes ZERO network requests. No HTTP/updater/opener plugins are pulled in
# on purpose — the only "action" the app takes is spawning a local process.

[profile.release]
opt-level = "s"   # tiny binary — this is a weekend artifact, not a game engine
lto = true
codegen-units = 1
panic = "abort"
strip = true
