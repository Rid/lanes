<svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#008080"/><stop offset="1" stop-color="#4374BA"/>
    </linearGradient>
    <linearGradient id="panelbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101e1e"/><stop offset="1" stop-color="#0a1416"/>
    </linearGradient>
    <linearGradient id="winA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1b1b"/><stop offset="1" stop-color="#0a1416"/>
    </linearGradient>
  </defs>

  <rect width="760" height="520" fill="#151515"/>
  <circle cx="120" cy="80" r="220" fill="#008080" opacity="0.10"/>
  <circle cx="640" cy="120" r="200" fill="#4374BA" opacity="0.10"/>

  <!-- two app windows behind, side by side, different lanes -->
  <g transform="translate(40,120) rotate(-2)">
    <rect width="260" height="300" rx="14" fill="url(#winA)" stroke="#1e2e2e"/>
    <rect width="260" height="3" rx="1.5" fill="#008080"/>
    <g transform="translate(18,22)"><circle cx="5" cy="5" r="5" fill="#2a3a3a"/><circle cx="22" cy="5" r="5" fill="#2a3a3a"/><circle cx="39" cy="5" r="5" fill="#2a3a3a"/></g>
    <text x="18" y="70" fill="#9fb4b4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">CLAUDE · WORK</text>
    <rect x="18" y="86" width="220" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
    <rect x="18" y="104" width="180" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
    <rect x="18" y="122" width="140" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
  </g>
  <g transform="translate(460,100) rotate(2)">
    <rect width="260" height="300" rx="14" fill="url(#winA)" stroke="#1e2e2e"/>
    <rect width="260" height="3" rx="1.5" fill="#4374BA"/>
    <g transform="translate(18,22)"><circle cx="5" cy="5" r="5" fill="#2a3a3a"/><circle cx="22" cy="5" r="5" fill="#2a3a3a"/><circle cx="39" cy="5" r="5" fill="#2a3a3a"/></g>
    <text x="18" y="70" fill="#9fb4b4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">CLAUDE · PERSONAL</text>
    <rect x="18" y="86" width="200" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
    <rect x="18" y="104" width="220" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
    <rect x="18" y="122" width="150" height="9" rx="4.5" fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- the Lanes tray panel, centered in front -->
  <g transform="translate(250,40)">
    <rect width="260" height="290" rx="16" fill="url(#panelbg)" stroke="#24403f"/>

    <!-- header -->
    <g transform="translate(16,14)">
      <rect x="0" y="2" width="5" height="18" rx="2.5" fill="url(#g)"/>
      <rect x="7" y="2" width="5" height="18" rx="2.5" fill="url(#g)" opacity="0.7"/>
      <rect x="14" y="2" width="4" height="18" rx="2" fill="url(#g)" opacity="0.4"/>
      <text x="29" y="16" fill="#ffffff" font-size="14" font-weight="700">Lanes</text>
      <g transform="translate(180,2)">
        <rect width="48" height="17" rx="6" fill="none" stroke="#1f3a3a"/>
        <text x="9" y="12" fill="#16a3a3" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">2 open</text>
      </g>
    </g>
    <line x1="0" y1="44" x2="260" y2="44" stroke="#1e2e2e"/>

    <!-- lane: Work (running) -->
    <g transform="translate(0,44)">
      <rect width="260" height="60" fill="#16a3a3" opacity="0.07"/>
      <rect x="16" y="15" width="3" height="30" rx="1.5" fill="#008080"/>
      <rect x="29" y="17" width="26" height="26" rx="7" fill="none" stroke="#008080"/>
      <text x="42" y="34" fill="#cceeee" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">C</text>
      <text x="67" y="31" fill="#ffffff" font-size="13.5" font-weight="600">Claude</text>
      <text x="67" y="47" fill="#9fb4b4" font-size="11.5">Work</text>
      <circle cx="210" cy="30" r="4" fill="#16a3a3"/><circle cx="210" cy="30" r="6.5" fill="none" stroke="#16a3a3" opacity="0.3"/>
      <rect x="228" y="20" width="20" height="20" rx="6" fill="#ffffff" opacity="0.04"/>
      <text x="238" y="34" fill="#16a3a3" font-size="13" text-anchor="middle">›</text>
    </g>
    <line x1="0" y1="104" x2="260" y2="104" stroke="#1e2e2e" opacity="0.6"/>

    <!-- lane: Personal -->
    <g transform="translate(0,104)">
      <rect x="16" y="15" width="3" height="30" rx="1.5" fill="#16a3a3"/>
      <rect x="29" y="17" width="26" height="26" rx="7" fill="none" stroke="#16a3a3"/>
      <text x="42" y="34" fill="#cceeee" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">C</text>
      <text x="67" y="31" fill="#ffffff" font-size="13.5" font-weight="600">Claude</text>
      <text x="67" y="47" fill="#9fb4b4" font-size="11.5">Personal</text>
      <rect x="228" y="20" width="20" height="20" rx="6" fill="#ffffff" opacity="0.04"/>
      <text x="238" y="34" fill="#16a3a3" font-size="13" text-anchor="middle">›</text>
    </g>
    <line x1="0" y1="164" x2="260" y2="164" stroke="#1e2e2e" opacity="0.6"/>

    <!-- lane: Client -->
    <g transform="translate(0,164)">
      <rect x="16" y="15" width="3" height="30" rx="1.5" fill="#4374BA"/>
      <rect x="29" y="17" width="26" height="26" rx="7" fill="none" stroke="#4374BA"/>
      <text x="42" y="34" fill="#cceeee" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">C</text>
      <text x="67" y="31" fill="#ffffff" font-size="13.5" font-weight="600">Claude</text>
      <text x="67" y="47" fill="#9fb4b4" font-size="11.5">Client — Acme</text>
      <rect x="228" y="20" width="20" height="20" rx="6" fill="#ffffff" opacity="0.04"/>
      <text x="238" y="34" fill="#16a3a3" font-size="13" text-anchor="middle">›</text>
    </g>
    <line x1="0" y1="224" x2="260" y2="224" stroke="#1e2e2e"/>

    <!-- footer -->
    <g transform="translate(0,224)">
      <rect x="12" y="14" width="120" height="34" rx="9" fill="none" stroke="#1e2e2e"/>
      <text x="26" y="36" fill="#16a3a3" font-size="15">+</text>
      <text x="40" y="35" fill="#ffffff" font-size="13" font-weight="600">Add profile</text>
      <text x="190" y="35" fill="#9fb4b4" font-size="12">Manage</text>
      <text x="240" y="35" fill="#9fb4b4" font-size="12">Quit</text>
    </g>
  </g>
</svg>
